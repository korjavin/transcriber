name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Pull requests only build; pushes land on master, so they also publish.
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/korjavin/transcriber:latest
            ghcr.io/korjavin/transcriber:${{ github.sha }}
          cache-from: type=gha
          # Fork pull requests only get a read-only Actions cache, so export on push only.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
      # Redeploy the Portainer stack once the owner adds the webhook secret:
      # - name: Trigger Portainer redeploy
      #   if: github.event_name == 'push'
      #   env:
      #     HOOK: ${{ secrets.PORTAINER_WEBHOOK_URL }}
      #   run: curl -sS -X POST "$HOOK"
